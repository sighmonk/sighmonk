<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GitHub README preview - sighmonk</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --fg:#e6edf3; --muted:#8b949e;
    --border:#30363d; --link:#4493f8; --th:#161b22;
  }
  body.light{
    --bg:#ffffff; --card:#ffffff; --fg:#1f2328; --muted:#59636e;
    --border:#d1d9e0; --link:#0969da; --th:#f6f8fa;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;
       font-size:16px;line-height:1.5;}
  .wrap{max-width:1012px;margin:0 auto;padding:32px 32px 80px;}
  .topbar{display:flex;gap:8px;align-items:center;margin-bottom:24px;font-size:13px;color:var(--muted)}
  button{background:var(--card);color:var(--fg);border:1px solid var(--border);
         border-radius:6px;padding:5px 12px;font-size:13px;cursor:pointer}
  #content{background:var(--bg);padding:32px;border:1px solid var(--border);border-radius:6px}
  h1,h2,h3{font-weight:600;line-height:1.25;margin:24px 0 16px;padding-bottom:.3em;border-bottom:1px solid var(--border)}
  h1{font-size:2em} h2{font-size:1.5em} h3{font-size:1.25em;border:0;padding:0;margin:16px 0 8px}
  p{margin:0 0 16px}
  a{color:var(--link);text-decoration:none} a:hover{text-decoration:underline}
  ul{padding-left:2em;margin:0 0 16px} li{margin:.25em 0}
  table{border-collapse:collapse;margin:0 0 16px;display:table;width:auto}
  table td,table th{padding:6px 13px;border:1px solid var(--border);vertical-align:top}
  table th{background:var(--th);font-weight:600;text-align:left}
  table tr:nth-child(2n){background:rgba(128,128,128,.06)}
  /* HTML layout tables inside README should stay borderless */
  div[align="center"] table td{border:0;background:none!important;padding:4px}
  div[align="center"] table{width:100%}
  div[align="center"] table td h3{border:0}
  code{background:rgba(128,128,128,.18);padding:.2em .4em;border-radius:6px;font-size:85%;
       font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace}
  img{max-width:100%}
  hr{border:0;border-top:1px solid var(--border);margin:24px 0}
  sub{font-size:.75em;color:var(--muted)}
  div[align="center"]{text-align:center}
  div[align="center"] p img{margin:0 2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <b style="color:var(--fg)">sighmonk / sighmonk</b> <span>· README.md</span>
    <span style="flex:1"></span>
    <button id="toggle">light / dark</button>
  </div>
  <div id="content">loading…</div>
</div>
<script>
fetch('README.md').then(r => r.text()).then(md => {
  document.getElementById('content').innerHTML = marked.parse(md, {gfm:true, breaks:false});
});
document.getElementById('toggle').onclick = () => document.body.classList.toggle('light');
</script>
</body>
</html>
